# @format

# Notify the OS-Connect chatbot to re-ingest the corpus when the docs change.
#
# The chatbot's ingest job clones THIS repo directly (public, no creds) and embeds
# docs/ — so we fire on a git push to main, not on the Pages deploy (the published
# site is irrelevant to ingest). Re-ingest is a full re-embed/upsert and the receiver
# is gated by RAG_INGEST_ENABLED, so an extra notify is harmless.
#
# Two notifications, one per chatbot environment:
#   - dev:  a corpus-updated repository_dispatch, which ingest-dev.yaml listens for.
#   - prod: a workflow_dispatch of ingest-prod.yaml on the chatbot's main branch. A
#           repository_dispatch always runs from the chatbot's default branch (dev), so
#           prod is started by name on main instead, where only released code lives.
# Each is its own job, so one failing never hides or blocks the other.
#
# Auth: both POST to a DIFFERENT repo, which the built-in GITHUB_TOKEN cannot do (it is
# scoped to this repo only). INGEST_DISPATCH_TOKEN is a fine-grained PAT scoped to
# TDEI-osconnect-viewer-chatbot with Contents: read & write (the dev dispatch) and
# Actions: read & write (starting ingest-prod.yaml).
name: Notify Corpus Reingest
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:
concurrency:
  group: notify-reingest
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corpus-updated to chatbot ingest
        env:
          TOKEN: ${{ secrets.INGEST_DISPATCH_TOKEN }}
          # client_payload is INFORMATIONAL only — the receiver treats it as untrusted
          # and ignores it (it ingests CORPUS_REF from its own env, not the payload).
          PAYLOAD: '{"event_type":"corpus-updated","client_payload":{"ref":"${{ github.sha }}","source":"tcat-wiki"}}'
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::INGEST_DISPATCH_TOKEN is not set — cannot notify the chatbot repo." >&2
            exit 1
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TaskarCenterAtUW/TDEI-osconnect-viewer-chatbot/dispatches \
            -d "$PAYLOAD"
          echo "Dispatched corpus-updated for ${{ github.sha }}."

  notify-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Start prod ingest on the chatbot's main branch
        env:
          TOKEN: ${{ secrets.INGEST_DISPATCH_TOKEN }}
          # trigger=corpus-updated is what makes the run obey prod's RAG_INGEST_ENABLED
          # switch; a run started by hand in the chatbot repo ignores it.
          PAYLOAD: '{"ref":"main","inputs":{"trigger":"corpus-updated"}}'
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::INGEST_DISPATCH_TOKEN is not set — cannot notify the chatbot repo." >&2
            exit 1
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TaskarCenterAtUW/TDEI-osconnect-viewer-chatbot/actions/workflows/ingest-prod.yaml/dispatches \
            -d "$PAYLOAD"
          echo "Started prod ingest for ${{ github.sha }}."
