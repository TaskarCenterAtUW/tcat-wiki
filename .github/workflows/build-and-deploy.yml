# @format

name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.retry_deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python utilities/build_site.py --build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - uses: actions/deploy-pages@v5
        id: retry_deployment
        if: steps.deployment.outcome == 'failure'
